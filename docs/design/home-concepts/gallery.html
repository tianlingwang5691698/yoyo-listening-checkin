<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首页设计方案归档</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #18324a;
      background: #edf5f8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 32px 80px;
    }

    main {
      width: min(1480px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 650;
    }

    p {
      margin: 0 0 32px;
      color: #61798d;
    }

    h2 {
      margin: 44px 0 18px;
      font-size: 20px;
      font-weight: 650;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(70, 113, 139, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 16px 36px rgba(40, 79, 105, 0.08);
    }

    a {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
      height: 320px;
      object-fit: contain;
      background: #fff;
    }

    figcaption {
      padding: 13px 16px 15px;
      font-size: 14px;
      color: #49647a;
    }

    .selected img { height: 520px; }

    @media (max-width: 640px) {
      body { padding: 28px 16px 56px; }
      h1 { font-size: 26px; }
      .gallery { grid-template-columns: 1fr; }
      img, .selected img { height: auto; }
    }
  </style>
</head>
